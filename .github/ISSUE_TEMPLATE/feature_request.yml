name: Feature request
description: Propose a focused Apex capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Use case
      description: Explain the concrete creator or runtime need.
    validations:
      required: true
  - type: dropdown
    id: content_type
    attributes:
      label: Content type
      options:
        - World material or effect
        - PC avatar material
        - SDK mobile avatar fallback workflow
        - Editor tooling
        - Core or integration API
    validations:
      required: true
  - type: textarea
    id: targets
    attributes:
      label: Platform behavior
      description: Describe expected Windows PCVR/Desktop, Android/Quest world, iOS world, and mobile-avatar fallback behavior where applicable.
    validations:
      required: true
  - type: textarea
    id: budget
    attributes:
      label: Rendering budget
      description: Note expected texture samples, passes, transparency, variants, and performance constraints.
    validations:
      required: true
