
name: Feature request
description: Propose a focused Apex capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Use case
      description: Explain the concrete creator or runtime need.
    validations:
      required: true
  - type: textarea
    id: targets
    attributes:
      label: Minimum platform behavior
      description: Describe the expected iOS, Android, Quest, and PCVR fallback behavior.
    validations:
      required: true
