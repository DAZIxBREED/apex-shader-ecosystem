name: Build UPM Archives

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release source
        run: |
          python3 -m py_compile scripts/*.py
          bash -n scripts/publish_github.sh
          git diff --check
          git diff-tree --root --check --no-commit-id -r HEAD
          python3 scripts/validate_repo.py
      - name: Build and verify deterministic archives
        run: |
          python3 scripts/build_release_archives.py
          sha256sum artifacts/*.tar.gz > /tmp/apex-first.sha256
          python3 scripts/build_release_archives.py
          sha256sum artifacts/*.tar.gz > /tmp/apex-second.sha256
          diff -u /tmp/apex-first.sha256 /tmp/apex-second.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: apex-upm-${{ github.ref_name }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
