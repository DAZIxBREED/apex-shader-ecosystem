name: Validate Apex Packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check script syntax and whitespace
        run: |
          python3 -m py_compile scripts/*.py
          bash -n scripts/publish_github.sh
          git diff --check
          git diff-tree --root --check --no-commit-id -r HEAD
      - name: Validate package graph and shader source
        run: python3 scripts/validate_repo.py
      - name: Confirm generated metadata is reproducible
        run: |
          python3 scripts/generate_unity_meta.py
          git diff --exit-code
      - name: Confirm reproducible UPM archives build
        run: |
          python3 scripts/build_release_archives.py
          sha256sum artifacts/*.tar.gz > /tmp/apex-first.sha256
          python3 scripts/build_release_archives.py
          sha256sum artifacts/*.tar.gz > /tmp/apex-second.sha256
          diff -u /tmp/apex-first.sha256 /tmp/apex-second.sha256
