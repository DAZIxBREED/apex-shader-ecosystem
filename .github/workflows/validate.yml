
name: Validate Apex Packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate package graph and shader includes
        run: python3 scripts/validate_repo.py
      - name: Confirm generated metadata is reproducible
        run: |
          python3 scripts/generate_unity_meta.py
          git diff --exit-code
